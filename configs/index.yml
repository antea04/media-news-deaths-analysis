# Language/Region Index
#
# Using format as:
# ll_CC
#  - ll = ISO-639 language code
#  - CC = ISO-3166 country code
#
# This file maps language/region codes to their corresponding configuration files.
# Use these codes with: media-deaths [LANGUAGE_CODE]
#
# Format:
#   language_code:
#     name: Human-readable name
#     config: Path to config file (relative to this index file)
#     description: Optional description

ca_es:
  name: Catalan
  config: cat.yml
  description: Catalan media analysis using GenCat Salut data
